<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slideshow</title>
<link rel="stylesheet" href="slideshow.css">
</head>

<script>
// グローバル変数
let Num_image = 100;
let Count = -1;
let Toggle = 0;
let timerId = null;

// 切り替わる速さ(ミリ秒)
let INTERVAL_MS = 500;

// 女の子キャラの画像(立ち/しゃがみ)
let GIRL_STAND = "chara1stand.png";
let GIRL_CROUCH = "chara1sit.png";
let girlToggle = 0;

// 女の子をクリックしたときに立ち/しゃがみを切り替える(手モード中は無効)
function toggleGirl(){
    if(handMode) return;
    girlToggle ^= 1;
    document.getElementById("girl").src = girlToggle ? GIRL_CROUCH : GIRL_STAND;
}

// 手モード(女の子を長押ししている間だけドラッグして移動できるモード)
let handMode = false;
let dragging = false;
let offsetX = 0, offsetY = 0;
let pressTimer = null;

// 長押しと判定するまでの時間(ミリ秒)
const LONG_PRESS_MS = 0;

function toggleHandMode(){
    handMode = !handMode;
    document.getElementById("handBtn").classList.toggle("active", handMode);
    document.body.classList.toggle("hand-mode", handMode);
}

window.addEventListener("DOMContentLoaded", function(){
    let girl = document.getElementById("girl");
    let frame = document.getElementById("koma-frame");

    // マウス・タッチ・ペンをまとめて扱う(Pointer Events)
    girl.addEventListener("pointerdown", function(e){
        if(!handMode) return;
        e.preventDefault();

        // すぐには動かさず、一定時間押し続けたらドラッグ開始
        clearTimeout(pressTimer);
        pressTimer = setTimeout(function(){
            dragging = true;
            let girlRect = girl.getBoundingClientRect();
            offsetX = e.clientX - girlRect.left;
            offsetY = e.clientY - girlRect.top;
            girl.classList.add("dragging");
        }, LONG_PRESS_MS);

        // 指やマウスが少女の外に出てもイベントを受け取り続ける
        girl.setPointerCapture(e.pointerId);
    });

    girl.addEventListener("pointermove", function(e){
        if(!dragging) return;
        let frameRect = frame.getBoundingClientRect();
        girl.style.left = (e.clientX - frameRect.left - offsetX) + "px";
        girl.style.top  = (e.clientY - frameRect.top  - offsetY) + "px";
        girl.style.transform = "none";
    });

    function endPress(){
        clearTimeout(pressTimer);
        dragging = false;
        girl.classList.remove("dragging");
    }

    girl.addEventListener("pointerup", endPress);
    girl.addEventListener("pointercancel", endPress);
});

// 数値を0埋めn桁表示に変換
Number.prototype.d = function(keta){
    return String(Math.pow(10,keta)+this).slice(1);
};

// 指定した番号の写真を表示する
function showImage(n){
    document.getElementById("koma").src = n.d(3) + ".jpg";
}

// スライダーを動かしたとき
function moveSlider(value){
    clearTimeout(timerId);

    Count = Number(value);
    showImage(Count);

    document.getElementById("start").value = Count.d(3);
}

// スライドショー
function change(){
    if(Toggle == 1){
        Count = (Count + 1) % Num_image;
        showImage(Count);

        document.getElementById("slider").value = Count;
        document.getElementById("start").value = Count.d(3) + " ▷";

        timerId = setTimeout(change, INTERVAL_MS);
    } else {
        clearTimeout(timerId);
        document.getElementById("start").value = Count.d(3) + " ■";
    }
}

// 手動送り
function flip(n){
    clearTimeout(timerId);

    Count = (Count + n + Num_image) % Num_image;

    showImage(Count);

    document.getElementById("slider").value = Count;
    document.getElementById("start").value = Count.d(3);
}

// object-fit:coverと同じ考え方で、指定した縦横比に合わせて
// 元画像から切り出す範囲(元画像の解像度のまま)を計算する
function computeCoverRect(iw, ih, dr){
    let ir = iw / ih;
    let sx, sy, sw, sh;

    if(ir > dr){
        sh = ih;
        sw = ih * dr;
        sx = (iw - sw) / 2;
        sy = 0;
    } else {
        sw = iw;
        sh = iw / dr;
        sx = 0;
        sy = (ih - sh) / 2;
    }

    return { sx: sx, sy: sy, sw: sw, sh: sh };
}

// 「保存」ボタン: 独自の確認画面を開く
// (TwitterなどSNS内蔵ブラウザではwindow.confirm()がブロックされ
//  無反応になることがあるため、ネイティブのconfirmは使わない)
function saveWithGirl(){
    document.getElementById("confirmModal").style.display = "flex";
}

function closeConfirmModal(){
    document.getElementById("confirmModal").style.display = "none";
}

// 確認画面で「保存する」が押されたときの処理
function doSaveWithGirl(){
    closeConfirmModal();

    let frame = document.getElementById("koma-frame");
    let komaImg = document.getElementById("koma");
    let girlImg = document.getElementById("girl");

    let frameRect = frame.getBoundingClientRect();
    let girlRect = girlImg.getBoundingClientRect();

    try {
        // 表示上のフレームの縦横比に合わせて、元の写真の解像度のまま切り出す範囲を求める
        let dr = frameRect.width / frameRect.height;
        let rect = computeCoverRect(komaImg.naturalWidth, komaImg.naturalHeight, dr);

        // 出力キャンバスは元写真の解像度そのまま(縮小拡大しない)
        let canvas = document.createElement("canvas");
        canvas.width = Math.round(rect.sw);
        canvas.height = Math.round(rect.sh);

        let ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        // 背景の写真(元解像度のまま)
        ctx.drawImage(komaImg, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, canvas.width, canvas.height);

        // 表示上のフレームサイズ→出力キャンバスサイズへの倍率
        let scale = canvas.width / frameRect.width;

        // 女の子(フレーム内の現在位置・サイズをそのまま反映)
        let gx = (girlRect.left - frameRect.left) * scale;
        let gy = (girlRect.top  - frameRect.top ) * scale;
        let gw = girlRect.width  * scale;
        let gh = girlRect.height * scale;
        ctx.drawImage(girlImg, gx, gy, gw, gh);

        let fileName = "tsuugakuro_" + Count.d(3) + ".jpg";

        canvas.toBlob(function(blob){
            if(!blob){
                showResultModal(null, fileName);
                return;
            }

            let url = URL.createObjectURL(blob);

            // タッチ操作が主な端末(スマホ・タブレット)かどうかを判定
            let isTouchDevice =
                (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
                (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

            if(!isTouchDevice){
                // PC: 共有シートは使わず、そのままダウンロード
                let link = document.createElement("a");
                link.download = fileName;
                link.href = url;
                link.click();
                setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
                return;
            }

            let shared = false;

            // スマホなど: 対応していれば共有シート経由で保存(iPhoneのSafariなど)
            if(navigator.canShare){
                try {
                    let file = new File([blob], fileName, { type: "image/jpeg" });
                    if(navigator.canShare({ files: [file] })){
                        shared = true;
                        navigator.share({
                            files: [file],
                            title: "通学路記録"
                        }).catch(function(err){
                            // ユーザーがキャンセルした場合は何もしない
                            if(err && err.name === "AbortError") return;

                            // 共有できない環境向けの保険
                            console.error(err);
                            showResultModal(url, fileName);
                        });
                    }
                } catch(shareErr){
                    console.error(shareErr);
                    shared = false;
                }
            }

            // 共有シートが使えない環境(Twitterなどアプリ内ブラウザを含む)は
            // 画像を画面に表示して、長押しで保存してもらう
            if(!shared){
                showResultModal(url, fileName);
            }
        }, "image/jpeg", 0.95);
    } catch(err){
        showResultModal(null, null);
        console.error(err);
    }
}

// 保存できなかった/共有シートが使えない場合に、
// 画像を表示して手動保存してもらうための画面
function showResultModal(url, fileName){
    let img = document.getElementById("resultImage");
    let link = document.getElementById("resultDownloadLink");
    let note = document.getElementById("resultNote");

    if(url){
        img.src = url;
        img.style.display = "block";
        link.href = url;
        link.download = fileName || "tsuugakuro.jpg";
        link.style.display = "inline-block";
        note.textContent = "画像を長押しして「写真に保存」を選ぶか、下のリンクからダウンロードしてください。";
    } else {
        img.style.display = "none";
        link.style.display = "none";
        note.textContent = "保存に失敗しました。時間をおいて、もう一度お試しください。";
    }

    document.getElementById("resultModal").style.display = "flex";
}

function closeResultModal(){
    document.getElementById("resultModal").style.display = "none";
}
</script>

<body>

<div class="header-row">
    <span class="help-link-spacer" aria-hidden="true">遊び方</span>
    <h1>通学路　記録</h1>
    <a href="#help" class="help-link">遊び方</a>
</div>

<input type="button" name="prev" value="◀" onclick="flip(-1);">
<input type="button" id="start" value="start" onclick="Toggle^=1; change();">
<input type="button" name="next" value="▶" onclick="flip(1);">

<div class="slideshow-area">
    <!-- スライダー(縦向き) -->
    <input
        type="range"
        id="slider"
        orient="vertical"
        min="0"
        max="99"
        value="0"
        oninput="moveSlider(this.value)">

    <div class="slide">
        <div id="koma-frame">
            <img id="koma" src="000.jpg">
            <img id="girl" src="chara1stand.png" draggable="false" onclick="toggleGirl();">
        </div>
    </div>

    <!-- 手モード切り替えボタン -->
    <input type="button" id="handBtn" value="手" onclick="toggleHandMode();">
</div>

<div id="help" class="help-box">
    <h2>〈遊び方〉</h2>
    <ul>
        <li>・上部の数字ボタンを押すと自動で画像が切り替わります</li>
        <li>・少女をタップすると「しゃがむ/立つ」の変更ができます</li>
        <li>・「手」ボタンをタップすると「つかみモード」になります、もう一度ボタンを押すとモードが解除できます<br>(このとき少女を長押ししている間は場所を移動させることができます)</li>
        <li>・お気に入りの風景を見つけたら保存してみましょう</li>
    </ul>
</div>

<div class="save-area">
    <input type="button" id="saveBtn" value="保存" onclick="saveWithGirl();">
</div>

<!-- 保存確認画面(独自モーダル。SNS内蔵ブラウザ等でwindow.confirm()が
     ブロックされることがあるため、ネイティブのconfirmは使わない) -->
<div id="confirmModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <p>この通学路を保存しますか?</p>
        <div class="modal-buttons">
            <input type="button" value="保存する" onclick="doSaveWithGirl();">
            <input type="button" value="キャンセル" onclick="closeConfirmModal();">
        </div>
    </div>
</div>

<!-- 保存結果画面(共有シートが使えない場合、長押し保存用に画像を表示) -->
<div id="resultModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <p id="resultNote"></p>
        <img id="resultImage" alt="保存する画像">
        <div class="modal-buttons">
            <a id="resultDownloadLink" class="modal-download-link">ダウンロード</a>
            <input type="button" value="閉じる" onclick="closeResultModal();">
        </div>
    </div>
</div>

</body>
</html>
